[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carp-systems"
version = "0.1.0"
description = "C.A.R.P. (Computer-Assisted Recognition & Perception): koi variety classification and individual identification for ChampKoi"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Inference on a laptop or Raspberry Pi pond node.
vision = [
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
]
# Training and export. Ultralytics is AGPL-3.0; see docs/adr/0001-python-monorepo.md.
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "ultralytics>=8.3",
    "faiss-cpu>=1.8",
    "opencv-python-headless>=4.9",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
carp = "carp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/carp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
